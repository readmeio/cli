name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # see the following:
          # https://github.com/actions/setup-node?tab=readme-ov-file#supported-version-syntax
          # https://github.com/nvm-sh/nvm/issues/1998#issuecomment-594958684
          - lts/-1
          - lts/*
          - latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-gha:
    name: GitHub Action bundle is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - lts/-1

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # dist-gha/ is committed so the Action works straight off a git ref
      # with no install step (see action.yml). Rebuilding it here and diffing
      # against what's committed catches the case where someone edits
      # src/gha.js (or anything it imports) without re-running
      # `npm run build:gha` — otherwise the Action would silently keep
      # running stale code with no error anywhere.
      - name: Rebuild and check for drift
        run: |
          npm run build:gha
          if ! git diff --exit-code -- dist-gha; then
            echo "::error::dist-gha/ is out of date. Run \`npm run build:gha\` and commit the result."
            exit 1
          fi
