name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # see https://github.com/actions/setup-node?tab=readme-ov-file#supported-version-syntax
          - lts/-1
          - lts/*
          - latest

    steps:
      - uses: actions/checkout@v7

      # package-lock.json records @readmeio/git-format as git+ssh; rewrite to
      # HTTPS so npm ci works without an SSH key.
      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --force: @readmeio/git-format lists darwin-only fsevents as a required
      # dependency, which otherwise fails npm ci on Linux.
      - name: Install dependencies
        run: npm ci --force

      - name: Run tests
        run: npm test
